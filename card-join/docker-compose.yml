# ============================================================================
# Отдельный сервис подключения игроков к матчу по ссылке-приглашению.
# Запуск:  docker compose up -d --build
# Проверка: http://localhost:8080
#
# PostgreSQL для этого этапа не нужен: матчи хранятся в памяти контейнера
# (сохраняются, пока контейнер работает; после перезапуска — чисто).
# ============================================================================
services:
  join:
    build: .
    image: card-join:latest
    container_name: cardgame-join
    restart: unless-stopped
    ports:
      - "8080:8080"   # хост:порт — сюда открывают ссылку-приглашение
